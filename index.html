<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with the HTML Audio Element</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 56px 20px 80px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            background: #0b0f2a;
            overflow-x: hidden;
            counter-reset: track;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -1;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.85;
            animation: drift 18s ease-in-out infinite alternate;
        }

        body::before {
            width: 520px;
            height: 520px;
            top: -120px;
            left: -120px;
            background: radial-gradient(circle, #ff4fa3, transparent 70%);
        }

        body::after {
            width: 600px;
            height: 600px;
            bottom: -160px;
            right: -140px;
            background: radial-gradient(circle, #3a7bff, transparent 70%);
            animation-delay: -6s;
        }

        @keyframes drift {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(60px, 40px) scale(1.15);
            }
        }

        .glass {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.07));
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            backdrop-filter: blur(26px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 0 rgba(255, 255, 255, 0.12),
                inset 0 0 22px rgba(255, 255, 255, 0.08),
                0 24px 60px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 38%);
            pointer-events: none;
        }

        header.glass {
            max-width: 640px;
            margin: 0 auto 28px;
            padding: 30px 28px;
            text-align: center;
            border-radius: 36px;
        }

        h1 {
            position: relative;
            font-size: clamp(2rem, 6vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .tagline {
            position: relative;
            margin-top: 6px;
            color: rgba(255, 255, 255, 0.72);
        }

        main {
            max-width: 640px;
            margin: 0 auto;
            display: grid;
            gap: 22px;
        }

        .track {
            padding: 26px 26px 24px;
            border-radius: 30px;
            transition: transform 0.35s ease;
        }

        .track:hover {
            transform: translateY(-4px) scale(1.01);
        }

        .track::after {
            counter-increment: track;
            content: "0" counter(track);
            position: absolute;
            top: 22px;
            right: 24px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.72);
        }

        h2 {
            position: relative;
            font-size: 1.5rem;
            font-weight: 650;
            padding-right: 40px;
        }

        .artist {
            position: relative;
            margin: 4px 0 18px;
            color: rgba(255, 255, 255, 0.72);
        }

        audio {
            position: relative;
            display: block;
            width: 100%;
            height: 48px;
            border-radius: 999px;
            color-scheme: dark;
            background: rgba(255, 255, 255, 0.18);
        }

        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass {
                background: rgba(40, 50, 100, 0.85);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            body::before,
            body::after {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <header class="glass">
        <h1>freeCodeCamp Tunes</h1>
        <p class="tagline">Press play and let it loop.</p>
    </header>

    <main>
        <section class="track glass">
            <h2>Can't Stay Down</h2>
            <p class="artist">Artist: Quincy Larson</p>
            <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/can%27t-stay-down.mp3" loop
                controls></audio>
        </section>

        <section class="track glass">
            <h2>Cruising for a Musing</h2>
            <p class="artist">Artist: Quincy Larson</p>
            <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3" loop
                controls></audio>
        </section>

        <section class="track glass">
            <h2>Scratching the Surface</h2>
            <p class="artist">Artist: Quincy Larson</p>
            <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/scratching-the-surface.mp3" loop
                controls></audio>
        </section>
    </main>
</body>

</html>
